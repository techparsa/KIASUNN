<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>در حال آپدیت - هشدار پرداخت</title>
    <style>
        /* تنظیمات کلی صفحه */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            direction: rtl;
            padding: 1rem;
        }

        /* کارت اصلی */
        .update-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 3rem;
            padding: 4rem 3.5rem;
            max-width: 750px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: transform 0.3s ease;
        }

        .update-card:hover {
            transform: scale(1.02);
        }

        /* آیکون یا لوگو */
        .icon {
            font-size: 5rem;
            display: inline-block;
            background: rgba(255, 255, 255, 0.1);
            padding: 1.2rem;
            border-radius: 50%;
            margin-bottom: 1.8rem;
            animation: pulse-icon 2s infinite;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        @keyframes pulse-icon {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.3); }
            50% { transform: scale(1.1); box-shadow: 0 0 30px 10px rgba(100, 150, 255, 0.4); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
        }

        /* عنوان اصلی */
        h1 {
            color: #ffffff;
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 20px rgba(100, 150, 255, 0.3);
        }

        /* زیرنویس */
        .subtitle {
            color: #c8d6e5;
            font-size: 1.3rem;
            font-weight: 300;
            margin-bottom: 2rem;
            border-bottom: 2px dashed rgba(255, 255, 255, 0.15);
            padding-bottom: 1.5rem;
        }

        /* وضعیت بروزرسانی */
        .status {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.8rem;
            margin: 1.5rem 0 1.8rem 0;
            flex-wrap: wrap;
        }

        .status .dot {
            width: 18px;
            height: 18px;
            background: #4ecdc4;
            border-radius: 50%;
            display: inline-block;
            animation: blink 1.2s infinite;
        }

        .status .dot:nth-child(2) {
            animation-delay: 0.2s;
            background: #ffe66d;
        }

        .status .dot:nth-child(3) {
            animation-delay: 0.4s;
            background: #ff6b6b;
        }

        @keyframes blink {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .status-text {
            color: #f0f0f0;
            font-size: 1.5rem;
            font-weight: 400;
            letter-spacing: 1px;
        }

        /* باکس هشدار جدید - پیگیری و حذف */
        .alert-box {
            background: rgba(255, 70, 70, 0.15);
            border: 2px solid #ff4757;
            border-radius: 16px;
            padding: 1.2rem 1.8rem;
            margin: 1.5rem 0 1.8rem 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            flex-wrap: wrap;
            backdrop-filter: blur(4px);
            box-shadow: 0 0 25px rgba(255, 70, 70, 0.2);
            animation: alert-pulse 2s infinite ease-in-out;
        }

        @keyframes alert-pulse {
            0% { border-color: #ff4757; box-shadow: 0 0 15px rgba(255, 70, 70, 0.1); }
            50% { border-color: #ff6b81; box-shadow: 0 0 30px rgba(255, 70, 70, 0.4); }
            100% { border-color: #ff4757; box-shadow: 0 0 15px rgba(255, 70, 70, 0.1); }
        }

        .alert-box .alert-icon {
            font-size: 2rem;
            line-height: 1;
        }

        .alert-box .alert-text {
            color: #ffcccc;
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.3);
        }

        .alert-box .alert-text strong {
            color: #ff6b6b;
            background: rgba(0, 0, 0, 0.3);
            padding: 0.1rem 0.8rem;
            border-radius: 30px;
            font-size: 1.2rem;
            margin: 0 0.3rem;
        }

        .alert-box .highlight-warning {
            color: #ffdd59;
            font-weight: 700;
        }

        /* توضیحات تکمیلی */
        .description {
            color: #b0c4de;
            font-size: 1.1rem;
            line-height: 1.8;
            margin: 1.5rem 0 2.5rem 0;
            background: rgba(0, 0, 0, 0.2);
            padding: 1rem 1.8rem;
            border-radius: 50px;
            display: inline-block;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* نوار پیشرفت متحرک */
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin: 1.8rem 0 1rem 0;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #4ecdc4, #ffe66d, #ff6b6b);
            border-radius: 10px;
            animation: loading 2.5s infinite ease-in-out;
        }

        @keyframes loading {
            0% { width: 0%; transform: translateX(0); }
            50% { width: 70%; transform: translateX(10%); }
            100% { width: 100%; transform: translateX(0); }
        }

        /* تاریخ بروزرسانی */
        .update-date {
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.9rem;
            margin-top: 2rem;
            letter-spacing: 1px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 1.5rem;
        }

        /* واکنش‌گرایی برای موبایل */
        @media (max-width: 600px) {
            .update-card {
                padding: 2.5rem 1.5rem;
                border-radius: 2rem;
            }
            h1 {
                font-size: 2.2rem;
            }
            .subtitle {
                font-size: 1rem;
            }
            .status-text {
                font-size: 1.2rem;
            }
            .icon {
                font-size: 3.5rem;
                padding: 0.8rem;
            }
            .alert-box .alert-text {
                font-size: 1rem;
            }
            .alert-box {
                padding: 1rem;
            }
            .description {
                font-size: 0.95rem;
                padding: 0.7rem 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="update-card">
        <!-- آیکون -->
        <div class="icon">⚙️</div>

        <!-- عنوان -->
        <h1>در حال آپدیت</h1>
        <div class="subtitle">به‌زودی با امکانات جدید بازمی‌گردیم</div>

        <!-- وضعیت با نقاط متحرک -->
        <div class="status">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="status-text">بروزرسانی در حال انجام...</span>
        </div>

        <!-- ========================================== -->
        <!-- باکس هشدار جدید (همون درخواست شما)         -->
        <!-- ========================================== -->
        <div class="alert-box">
            <span class="alert-icon">⛔</span>
            <span class="alert-text">
                <strong>هشدار!</strong> 
                لطفاً هرچه سریعتر نسبت به <span class="highlight-warning">تسویه هزینه‌های معوقه</span> اقدام کنید.
                در غیر این صورت، <span style="color:#ff4757; font-weight:900;">حساب کاربری شما تا ۴۸ ساعت آینده حذف خواهد شد</span>.
            </span>
        </div>

        <!-- توضیح -->
        <div class="description">
            🚀 تیم ما مشغول بهبود و افزودن قابلیت‌های جدید است.
        </div>

        <!-- نوار پیشرفت تزیینی -->
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>

        <!-- تاریخ -->
        <div class="update-date">
            آخرین بروزرسانی: ۱۵ مرداد ۱۴۰۵
        </div>
    </div>
</body>
</html>
